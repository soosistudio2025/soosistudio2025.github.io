<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest-admin.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="宿洗 Admin">
    <link rel="apple-touch-icon" href="nav.png">
    <link rel="icon" type="image/png" href="nav.png">
    <meta name="theme-color" content="#6A8D73">
    <title>宿洗 Soosi | 後台管理系統</title>    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset('soosi-react', {
            presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
        });
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        soosi: {
                            green: '#6A8D73',      // 主色：綠色
                            wood: '#8E6E53',       // 副色：木頭色
                            dark: '#3F3F3F',       // 文字：深灰
                            light: '#F9F7F2',      // 背景：米白
                            accent: '#E6C66D',     // 點綴：金黃
                            red: '#D67D7D'         // 警示：柔和紅
                        }
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root { --brand-bg: #F9F7F2; }
        body {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            background-color: var(--brand-bg);
            color: #3F3F3F;
            -webkit-font-smoothing: antialiased;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(106, 141, 115, 0.1);
            border-radius: 2rem;
        }

        .cute-card {
            background: #FFFDF9;
            border: 2px solid #F0ECE6;
            border-radius: 1.5rem;
            box-shadow: 3px 3px 0px 0px rgba(142, 110, 83, 0.05);
            transition: all 0.2s;
        }
        .cute-card:hover { transform: translateY(-2px); box-shadow: 4px 4px 0px 0px rgba(106, 141, 115, 0.1); border-color: #6A8D73; }

        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 900; }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-confirmed { background: #D1FAE5; color: #059669; }
        .status-completed { background: #E5E7EB; color: #374151; }
        .status-cancelled { background: #FEE2E2; color: #DC2626; }
        
        .admin-input {
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 14px;
            color: #333;
        }
        .admin-input:focus { outline: none; border-color: #6A8D73; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="soosi-react">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Supabase Config ---
        const supabaseUrl = 'https://uhrngtsashumvwgzaumm.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVocm5ndHNhc2h1bXZ3Z3phdW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMjMxNDUsImV4cCI6MjA4NDg5OTE0NX0.YDopNd9MHsjV9LFsHWyrxFIcWgQ_s0BMJlNSFqQfiTE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const ADMIN_EMAIL = "soosi.studio2025@gamil.com";
        const STAFF_EMAIL = "soosi.studio2025@staff.com";

        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({ root: iconRef.current, attrs: { "stroke-width": 2.5, class: className } });
                }
            }, [name, className]);
            return <span ref={iconRef} key={name} className="inline-flex items-center justify-center"><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        };

        // --- 翻譯與格式化工具 ---
        const T = (key) => {
            if (key === true || key === 'true') return '是';
            if (key === false || key === 'false') return '否';
            if (!key) return '-';
            
            const map = {
                'basic': '小美容', 'full': '大美容',
                'dog': '狗狗', 'cat': '貓咪',
                'grooming': '美容', 'boarding': '住宿', 'daycare': '安親',
                'local_style': '局部修飾', 'special_style': '特殊造型', 'scissor_cut': '全身手剪',
                'local_degrease': '局部去油', 'full_degrease': '全身去油',
                'spa_dental': '口腔凝膠', 'spa_oil': '潔膚油', 'spa_ear': '日本採耳',
                'spa_carbon': '碳酸浴', 'spa_bath': '舒敏浴', 'spa_nano': '奈米浴',
                'spa_salt': '海鹽浴', 'spa_mud_exfoliate': '去角質泥', 'spa_bubble': '泡泡浴', 'spa_volcano': '火山泥',
                'spa_ceramide_local': '局部保濕', 'spa_ceramide_full': '全身保濕',
                'other': '其他項目'
            };
            return map[key] || key;
        };

        // --- 權限驗證 Modal (改用 Supabase 帳密驗證) ---
        const SecurityModal = ({ isOpen, onClose, onConfirm, title = "敏感操作驗證" }) => {
            const [pwd, setPwd] = useState("");
            const [verifying, setVerifying] = useState(false);

            if (!isOpen) return null;

const handleVerify = async () => {
                setVerifying(true);
                try {
                    // 🌟 核心修正：先檢查當前登入狀態，避免 user 為空導致報錯
                    const { data: { user: currentUser }, error: userError } = await supabaseClient.auth.getUser();
                    
                    if (userError || !currentUser) {
                        throw new Error("驗證失敗：登入資訊已過期，請重新整理頁面。");
                    }

                    // 使用獲取到的 currentUser.email 進行二段驗證
                    const { error: loginError } = await supabaseClient.auth.signInWithPassword({
                        email: currentUser.email,
                        password: pwd,
                    });

                    if (loginError) throw new Error("密碼錯誤，驗證失敗");
                    
                    onConfirm(); // 驗證通過，執行刪除或儲存動作
                    setPwd("");
                    onClose();
                } catch (err) {
                    alert(err.message);
                } finally {
                    setVerifying(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl animate-in zoom-in-95">
                        <h3 className="font-black text-lg text-center mb-1">{title}</h3>
                        <p className="text-[10px] text-gray-400 text-center mb-4 font-bold">請輸入您的密碼以確認變更</p>
                        <input type="password" autoFocus placeholder="您的帳戶密碼" 
                            className="w-full border-2 border-gray-200 rounded-xl p-3 text-center mb-4 outline-none focus:border-soosi-wood"
                            value={pwd} onChange={e=>setPwd(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleVerify()}
                        />
                        <div className="flex gap-2">
                            <button onClick={onClose} className="flex-1 py-2 bg-gray-100 rounded-lg text-xs font-bold text-gray-500">取消</button>
                            <button onClick={handleVerify} disabled={verifying} className="flex-1 py-2 bg-soosi-dark text-white rounded-lg text-xs font-bold">
                                {verifying ? '驗證中...' : '確認'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 登入 View ---
        const LoginView = ({ onLogin }) => {
            const [loginEmail, setLoginEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                const { data, error: authError } = await supabaseClient.auth.signInWithPassword({ email: loginEmail, password });
                if (authError) {
                    setError('帳號或密碼錯誤');
                    setLoading(false);
                } else {
                    onLogin();
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-soosi-green/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-80 h-80 bg-soosi-wood/10 rounded-full blur-3xl"></div>
                    
                    <div className="glass-card w-full max-w-md p-10 text-center relative z-10 animate-in zoom-in duration-500">
                        <img src="nav.png" className="w-40 mx-auto mb-6 drop-shadow-sm" alt="Soosi Logo" />
                        
                        {!loginEmail ? (
                            <div className="space-y-4">
                                <h1 className="text-xl font-black text-soosi-dark mb-6">宿洗 Soosi | 管理後台</h1>
                                <button onClick={() => setLoginEmail(ADMIN_EMAIL)} className="w-full bg-white border-2 border-soosi-green/20 hover:border-soosi-green hover:bg-soosi-green/5 text-soosi-dark py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition-all active:scale-95">
                                    <div className="w-10 h-10 rounded-full bg-soosi-green text-white flex items-center justify-center"><Icon name="shield" /></div>
                                    管理員登入
                                </button>
                                <button onClick={() => setLoginEmail(STAFF_EMAIL)} className="w-full bg-white border-2 border-soosi-wood/20 hover:border-soosi-wood hover:bg-soosi-wood/5 text-soosi-dark py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition-all active:scale-95">
                                    <div className="w-10 h-10 rounded-full bg-soosi-wood text-white flex items-center justify-center"><Icon name="user" /></div>
                                    員工登入
                                </button>
                                <a href="./index.html" className="inline-flex items-center gap-2 mb-6 text-xs font-bold text-soosi-wood hover:text-soosi-green transition-colors">
    <Icon name="arrow-left" size={14}/> 返回填寫首頁
</a>
                            </div>
                        ) : (
                            <form onSubmit={handleLogin} className="space-y-4 animate-in fade-in slide-in-from-bottom-2">
<div className="text-center mb-4">
    <span className={`px-6 py-2 rounded-full text-sm font-black text-white shadow-sm ${loginEmail === ADMIN_EMAIL ? 'bg-soosi-green' : 'bg-soosi-wood'}`}>
        {loginEmail === ADMIN_EMAIL ? '管理員模式' : '員工模式'}
    </span>
</div>
                                <input type="password" placeholder="請輸入密碼" value={password} onChange={e=>setPassword(e.target.value)} className="w-full text-center py-4 rounded-2xl border-2 border-soosi-green/20 focus:border-soosi-green outline-none font-black text-lg tracking-widest" autoFocus />
                                {error && <p className="text-soosi-red text-xs font-black">{error}</p>}
                                <button disabled={loading} className="w-full bg-soosi-dark text-white py-4 rounded-2xl font-black text-lg shadow-lg hover:opacity-90 transition-all flex items-center justify-center gap-2">
                                    {loading ? <Icon name="loader-2" className="animate-spin" /> : '確認登入'}
                                </button>
                                <button type="button" onClick={() => setLoginEmail('')} className="text-xs font-bold text-gray-400 hover:text-soosi-dark transition-colors">← 切換身分</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };
// 🌟 修正：RenderField 獨立在外部，並移除 copy/link 功能
        const RenderField = ({ label, value, editPath, type = 'text', highlight = false, isEditing, onChange }) => (
            <div className="mb-2">
                <label className="text-[10px] font-bold text-gray-400 block mb-0.5">{label}</label>
                {isEditing ? (
                    <input 
                        type={type} 
                        value={value || ''} 
                        onChange={(e) => onChange(editPath, e.target.value)} 
                        className="admin-input"
                    />
                ) : (
                    <div className={`font-bold text-sm break-words ${highlight ? 'text-soosi-red' : 'text-soosi-dark'}`}>
                        {T(value)}
                    </div>
                )}
            </div>
        );
// --- 訂單詳情 Modal (乾淨版：無複製/導航，鍵盤正常) ---
        const OrderModal = ({ user, order, onClose, onUpdateStatus, onUpdateNote, onDeleteOrder, onUpdateFullOrder }) => {
            if (!order) return null;
const [showReport, setShowReport] = useState(false);
            const [reportType, setReportType] = useState('grooming'); // 🌟 新增：區分報告類型
            const [localNote, setLocalNote] = useState(order.admin_note || '');
            const [isEditing, setIsEditing] = useState(false);
            const [showAuth, setShowAuth] = useState(false); 
const [showDeleteAuth, setShowDeleteAuth] = useState(false); 
            const [editData, setEditData] = useState(JSON.parse(JSON.stringify(order))); 
            
            // 🌟 新增：重寄信件狀態
            const [isResending, setIsResending] = useState(false);

// 🌟 新增：重寄信件函式
            const handleResendEmail = async () => {
                const confirmText = order.email
                    ? `確定要重寄契約副本至 ${order.email} 嗎？(副本將抄送店家)`
                    : `此訂單未填寫 Email，仍要重寄給店家嗎？`;

                if (!confirm(confirmText)) return;

                setIsResending(true);
                try {
                    // 重組傳送給 Edge Function 的資料 (確保與 index.html 格式一致)
                    const rawProps = order.raw_data?.raw_data || order.raw_data || {};
const payload = {
                        ...rawProps,
                        owner_name: order.owner_name,
                        phone: order.phone,
                        email: order.email,
                        total_price: order.total_price,
                        isBoarding: ['boarding', 'daycare'].includes(order.service_type),
                        isDaycare: order.service_type === 'daycare',
                        signature_url: order.signature_url,
                        signed_at: order.created_at, // 🌟 傳入當初簽署(訂單成立)的時間
                        petList: order.booking_pets.map(p => ({
                            ...p,
                            addGrooming: p.add_grooming, // 轉換欄位名稱以符合後端預期
                            boarding_grooming_price: p.boarding_grooming_price
                        }))
                    };

                    const resp = await fetch(`${supabaseUrl}/functions/v1/send-resend-email`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${supabaseKey}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!resp.ok) throw new Error("發送失敗");
                    alert("✅ 契約副本已成功重新寄出！");
                } catch (e) {
                    console.error("重寄失敗:", e);
                    alert("❌ 重寄失敗，請稍後再試或檢查 Edge Function 狀態。");
                } finally {
                    setIsResending(false);
                }
            };

            const isBoarding = order.service_type === 'boarding' || order.service_type === 'daycare';
            const getRaw = (key) => editData.raw_data?.raw_data?.[key] || editData.raw_data?.[key] || '';
            const hasAddGrooming = (getRaw('addGrooming') === true || getRaw('addGrooming') === 'true');

            const handleNoteBlur = () => { if (localNote !== order.admin_note) onUpdateNote(order.id, localNote); };

            // 處理編輯變更
            const handleEditChange = (path, value) => {
                setEditData(prev => {
                    const newData = { ...prev };
                    if (path.startsWith('owner_')) newData[path] = value;
                    else if (path === 'phone' || path === 'email' || path === 'total_price') newData[path] = value;
                    else if (path.startsWith('raw_data.')) {
                        const key = path.split('.')[1];
                        if (!newData.raw_data) newData.raw_data = {};
                        if (!newData.raw_data.raw_data) newData.raw_data.raw_data = {}; 
                        newData.raw_data.raw_data[key] = value;
                    }
                    return newData;
                });
            };

            const saveChanges = () => { onUpdateFullOrder(editData); setIsEditing(false); };

const formatAge = (pet) => {
                const ageVal = pet.age;
                // 1. 處理無資料或 null 的情況
                if (ageVal === null || ageVal === undefined || ageVal === '') return '-';

                const ageNum = parseFloat(ageVal);
                
                // 2. 判斷是否未滿一歲 (或是 age 數值小於 1)
                // 註：資料庫小數點 0.0833 = 1個月, 0.5 = 6個月
                if (pet.is_under_one || ageNum < 1) {
                    const months = Math.round(ageNum * 12);
                    // 確保如果大於 0 但算出來是 0 (極小數)，也至少顯示 1 個月
                    const displayMonths = (months === 0 && ageNum > 0) ? 1 : months;
                    return <span className="text-soosi-accent font-bold">{displayMonths} 個月</span>;
                }
                
                // 3. 超過一歲直接顯示歲數
                return `${ageNum} 歲`;
            };

            const getPetTypeLabel = (pet) => {
                const type = pet.pet_type || 'dog';
                return type === 'cat' ? '🐱 貓咪' : '🐶 狗狗';
            };
            
            const getVal = (pet, key) => pet[key] || getRaw(key);

// 價格明細顯示 Helper (修復 ReferenceError 並帶入寵物名稱)
            const renderPriceDetails = () => {
                const pricePerNight = parseInt(getRaw('price_per_night') || 0);
                const holidaySurcharge = parseInt(getRaw('holiday_surcharge') || 0);
                
                // 1. 自動計算住宿天數 (避免天數消失)
                let stayDuration = parseInt(getRaw('stayDuration') || 0);
                if (!stayDuration && order.check_in_date && order.check_out_date) {
                    const start = new Date(order.check_in_date);
                    const end = new Date(order.check_out_date);
                    stayDuration = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                }
                
                return (
                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 text-sm space-y-2 mb-4">
                        <div className="font-black text-gray-400 text-xs border-b border-gray-200 pb-2 mb-2 flex items-center gap-1">
                            <Icon name="file-text" size={14}/> 費用明細
                        </div>

                        {/* --- 1. 住宿/安親項目 --- */}
                        {isBoarding && stayDuration > 0 && pricePerNight > 0 && (
                            <>
                                <div className="flex justify-between">
                                    <span>🏠 住宿 ({stayDuration}晚)</span>
                                    <span className="font-bold">${stayDuration * pricePerNight}</span>
                                </div>
                                {stayDuration >= 6 && (
                                    <div className="flex justify-between text-soosi-green text-xs italic">
                                        <span>└ {stayDuration >= 15 ? '長住優惠 (85折)' : '長住優惠 (95折)'}</span>
                                        <span>- ${Math.round(stayDuration * pricePerNight * (stayDuration >= 15 ? 0.15 : 0.05))}</span>
                                    </div>
                                )}
                                {holidaySurcharge > 0 && (
                                    <div className="flex justify-between text-soosi-red">
                                        <span>+ 假日/特殊加價</span>
                                        <span className="font-bold">${holidaySurcharge}</span>
                                    </div>
                                )}
                            </>
                        )}

                        {/* --- 2. 美容與 SPA 項目 --- */}
                        {editData.booking_pets?.map((pet, idx) => {
const hasGrooming = isBoarding 
    ? (pet.add_grooming === true || pet.add_grooming === 'true' || pet.addGrooming === true || pet.addGrooming === 'true')
    : true;
                            const gPrice = parseInt(pet.grooming_price || 0);
                            
                            if (hasGrooming) {
                                return (
                                    <div key={idx} className="pt-1 border-t border-dashed border-gray-200 mt-1">
                                        <div className="flex justify-between text-soosi-dark font-black text-xs mb-1">
                                            <span>✂️ {pet.pet_name} 服務項目</span>
                                            {isBoarding && <span className="text-soosi-green font-bold">+ ${gPrice}</span>}
                                        </div>
                                        <div className="pl-4 space-y-0.5">
                                            {(pet.service_items || []).map((item, i) => (
                                                <div key={i} className="text-[11px] text-gray-500">• {T(item)}</div>
                                            ))}
                                            {getRaw('service_items_other') && (
                                                <div className="text-[11px] text-gray-400 italic">• 備註: {getRaw('service_items_other')}</div>
                                            )}
                                        </div>
                                    </div>
                                );
                            }
                            return null;
                        })}

                        {/* --- 3. 優惠折抵 (解決 ReferenceError 並顯示寵物名) --- */}
                        {(() => {
                            // 找出有勾選優惠的寵物 (支援資料庫與舊資料格式)
                            const promoPets = editData.booking_pets?.filter(p => 
                                p.use_promo_50 === true || p.use_promo_50 === 'true' || 
                                p.usePromo50 === true || p.usePromo50 === 'true'
                            ) || [];
                            
                            // 檢查整單是否有優惠標記
                            const isOrderPromo = (getRaw('usePromo50') === true || getRaw('usePromo50') === 'true') || 
                                               (getRaw('use_promo_50') === true || getRaw('use_promo_50') === 'true');

            if (!isOpen) return null;

                if (newPwd !== confirmPwd) return alert("❌ 新密碼與確認密碼不符");
                if (newPwd.length < 6) return alert("❌ 密碼長度需至少 6 碼");
                
                setLoading(true);
                try {
                    // 1. 執行環境檢查與登入驗證
                    // 為了修改密碼，必須以「該目標帳號」的身份進行驗證
                    const { error: verifyError } = await supabaseClient.auth.signInWithPassword({
                        email: targetEmail,
                        password: oldPwd
                    });
                    
                    if (verifyError) throw new Error(`${targetEmail === ADMIN_EMAIL ? '您的舊密碼' : '員工的舊密碼'}輸入錯誤`);

                    // 2. 更新該帳號的密碼
                    const { error: updateError } = await supabaseClient.auth.updateUser({ password: newPwd });
                    if (updateError) throw updateError;

                    alert(`✅ [${targetEmail === ADMIN_EMAIL ? '管理員' : '員工'}] 密碼修改成功！`);
                    
                    // 3. 如果剛才是改員工密碼，系統現在是員工身份，需自動切換回管理員
                    if (targetEmail === STAFF_EMAIL) {
                        alert("正在切換回管理員權限...");
                        window.location.reload(); 
                    }

                    onClose();
                    setOldPwd(""); setNewPwd(""); setConfirmPwd("");
                } catch (err) {
                    alert("修改失敗：" + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">

                                    <div className="text-[10px] font-bold text-gray-400">毛孩數</div>

                                    <div key={order.id} onClick={() => { onSelectOrder(order); onClose(); }} className="bg-white p-4 rounded-2xl hover:border-soosi-green border-2 border-transparent cursor-pointer transition-all flex justify-between items-center group">
                                        <div className="flex items-center gap-3">

                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
// --- 升級版日曆檢視元件 (支援預約條顯示) ---
const CalendarView = ({ orders, onSelectOrder }) => {
            const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
            
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(today);

            const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
            const firstDayOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
            
            // 下拉清單用的：取得選定日期的狗狗詳細名單
            const dailyDogs = useMemo(() => {
                return orders.filter(o => {
                    if (o.status === 'cancelled') return false;
                    const date = selectedDate;
                    if (o.service_type === 'grooming') {
                        return (o.booking_date || o.check_in_date) === date;
                    } else {
                        return date >= o.check_in_date && date <= o.check_out_date;
                    }
                });
            }, [orders, selectedDate]);

            // 🌟 核心功能：判斷特定日期有哪些寵物 (用於日曆格子內顯示)
            const getPetsForDate = (dateStr) => {
                return orders.filter(o => {
                    if (o.status === 'cancelled') return false;
                    if (o.service_type === 'grooming') {
                        return (o.booking_date || o.check_in_date) === dateStr;
                    } else {
                        return dateStr >= o.check_in_date && dateStr <= o.check_out_date;
                    }
                });
            };

            return (
                <div className="space-y-4 animate-in fade-in">
                    {/* 月份選擇器與回今天按鈕 */}
                    <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
                        <div className="flex items-center gap-2">
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.setMonth(currentMonth.getMonth() - 1)))} className="p-2 hover:bg-gray-100 rounded-full transition-colors"><Icon name="chevron-left"/></button>
                            <h3 className="font-black text-lg">{currentMonth.getFullYear()}年 {currentMonth.getMonth() + 1}月</h3>
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.setMonth(currentMonth.getMonth() + 1)))} className="p-2 hover:bg-gray-100 rounded-full transition-colors"><Icon name="chevron-right"/></button>
                        </div>
                        <button onClick={() => { setCurrentMonth(new Date()); setSelectedDate(today); }} className="px-4 py-1.5 bg-soosi-dark text-white rounded-full text-xs font-black shadow-sm active:scale-95 transition-all">今天</button>
                    </div>

                    {/* 🌟 升級版日曆網格：調整高度以容納寵物條 */}
                    <div className="bg-white rounded-[2rem] border shadow-sm overflow-hidden">
                        <div className="grid grid-cols-7 bg-gray-50 border-b">
                            {['日','一','二','三','四','五','六'].map(d => <div key={d} className="text-center text-[10px] font-black text-gray-400 py-3">{d}</div>)}
                        </div>
                        <div className="grid grid-cols-7">
                            {[...Array(firstDayOfMonth)].map((_, i) => <div key={`empty-${i}`} className="border-b border-r border-gray-50 min-h-[100px]" />)}
                            {[...Array(daysInMonth)].map((_, i) => {
                                const d = i + 1;
                                const dateStr = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                const isSelected = dateStr === selectedDate;
                                const isToday = dateStr === today;
                                const petsInDay = getPetsForDate(dateStr);

                                return (
                                    <div key={d} onClick={() => setSelectedDate(dateStr)} 
                                        className={`min-h-[100px] border-b border-r border-gray-50 p-1 cursor-pointer transition-all hover:bg-soosi-green/5 ${isSelected ? 'bg-soosi-green/10 ring-2 ring-inset ring-soosi-green z-10' : ''}`}>
                                        <div className="flex justify-between items-start mb-1">
                                            <span className={`text-[11px] font-black w-6 h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-soosi-red text-white' : isSelected ? 'text-soosi-green' : 'text-gray-400'}`}>{d}</span>
                                        </div>
                                        
                                        {/* 🌟 寵物條清單 (限制顯示前3筆，其餘顯示 +更多) */}
                                        <div className="space-y-0.5 overflow-hidden">
                                            {petsInDay.slice(0, 3).map(o => (
<div key={o.id} className={`text-[9px] font-black px-1.5 py-0.5 rounded-sm truncate text-white shadow-sm ${o.service_type === 'grooming' ? 'bg-blue-400' : 'bg-orange-400'}`}>
                                                    {o.service_type === 'grooming' && o.booking_time && <span className="opacity-80">[{o.booking_time}] </span>}
                                                    {o.booking_pets?.map(p => p.pet_name).join(',')}
                                                </div>
                                            ))}
                                            {petsInDay.length > 3 && (
                                                <div className="text-[8px] text-gray-400 font-bold text-center mt-0.5">+{petsInDay.length - 3} 更多</div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 當日詳情清單 (維持原本設計，方便點擊看詳細資訊) */}
                    <div className="bg-[#F9F7F2] rounded-[2rem] p-6 border-2 border-dashed border-soosi-wood/20">
                        <div className="flex justify-between items-center mb-4">
                            <h4 className="font-black text-soosi-dark flex items-center gap-2">
                                <Icon name="calendar-check" className="text-soosi-wood"/> {selectedDate} 詳情名單
                            </h4>
                            <span className="bg-white border px-3 py-1 rounded-full text-[10px] font-black text-soosi-wood">{dailyDogs.length} 隻毛孩</span>
                        </div>
                        
                        <div className="space-y-3">
                            {dailyDogs.length > 0 ? dailyDogs.map(o => (
                                <div key={o.id} onClick={() => onSelectOrder(o)} className="bg-white p-4 rounded-2xl border border-gray-100 hover:border-soosi-green cursor-pointer transition-all flex justify-between items-center group shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-1.5 h-10 rounded-full ${o.service_type === 'grooming' ? 'bg-blue-400' : 'bg-orange-400'}`}></div>
                                        <div>
                                            <div className="font-black text-soosi-dark text-base">{o.booking_pets?.map(p => p.pet_name).join(', ')}</div>
<div className="text-[10px] text-gray-400 font-bold">{o.owner_name} · {o.service_type === 'grooming' ? `✂️ 美容 (${o.booking_time})` : '🏠 住宿/安親'}</div>
                                        </div>
                                    </div>
                                    <Icon name="chevron-right" size={16} className="text-gray-300 group-hover:text-soosi-green transition-transform group-hover:translate-x-1" />
                                </div>
                            )) : (
                                <div className="py-12 text-center">
                                    <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-300"><Icon name="calendar-off" size={32}/></div>
                                    <p className="text-gray-400 font-bold text-sm">此日期暫無任何預約紀錄 🍃</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };



        // --- 價目表管理組件 ---
        const PriceManager = () => {
            const [priceData, setPriceData] = useState({
                dogs: [],
                cats: [],
                extras: []
            });
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [activeCategory, setActiveCategory] = useState('dogs');
            const [toast, setToast] = useState(null);
            const [showPwdModal, setShowPwdModal] = useState(false);
            const [pendingSave, setPendingSave] = useState(false);
            // 住宿圖片預覽用
            const [boardingImages, setBoardingImages] = useState([]);
            const [boardingImagesLoading, setBoardingImagesLoading] = useState(false);
            // 用於強制重新整理住宿圖片元件
            const [boardingImagesKey, setBoardingImagesKey] = useState(0);

            // Toast 顯示函數
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const fetchPriceData = async () => {
                setLoading(true);
                try {
                    const { data, error } = await supabaseClient
                        .from('price_config')
                        .select('*');
                    
                    if (error) throw error;
                    
                    const result = { dogs: [], cats: [], extras: [] };
                    
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            if (item.category === 'dogs') result.dogs = item.config_value;
                            else if (item.category === 'cats') result.cats = item.config_value;
                            else if (item.category === 'extras') result.extras = item.config_value;
                        });
                    } else {
                        // 如果資料庫沒有資料，使用前台的預設值
                        result.dogs = [
                            { weight: '5kg 以下', typeA: '吉娃娃、迷你臘腸、迷你品、短毛幼犬', typeB: '貴賓、瑪爾濟斯、約克夏、博美、西施、蝴蝶犬', small: '500~700', full: '1000~1400' },
                            { weight: '5-10kg', typeA: '巴戈、法鬥、標準臘腸、傑克羅素、雪納瑞(短)', typeB: '比熊、狐狸犬、西高地、北京犬、雪納瑞(長)', small: '600~900', full: '1200~1800' },
                            { weight: '10-20kg', typeA: '柯基、柴犬、米格魯、台灣犬(小)、惠比特', typeB: '喜樂蒂、邊境牧羊犬、銀狐、澳洲牧羊犬', small: '1000~1800', full: '2000~3500' },
                            { weight: '20-30kg', typeA: '台灣犬(中)、高山犬、米克斯(中)', typeB: '哈士奇、鬆獅犬、標準貴賓、古代牧羊犬', small: '1400~2000', full: '2800~4500' },
                            { weight: '30-40kg', typeA: '拉布拉多、黃金獵犬、威瑪、杜賓、拳師', typeB: '薩摩耶、秋田、大型鬆獅、阿富汗獵犬', small: '1800~2200', full: '3600~5500' },
                            { weight: '40kg 以上', typeA: '大丹、羅威納、藏獒、大型獒犬', typeB: '阿拉斯加、大白熊、聖伯納、伯恩山', small: '2000~2400', full: '4000~6500' }
                        ];
                        result.cats = [
                            { type: '幼貓', sub: '2-6個月', small: '600', full: '-', note: '*視親人程度' },
                            { type: '短毛貓', sub: '2-6kg / >6kg', small: '800 / 1000', full: '1600 / 2000', note: '*6kg以上 +$100/kg' },
                            { type: '中長毛', sub: '2-6kg / >6kg', small: '1000 / 1200', full: '2000 / 2400', note: '*6kg以上 +$100/kg' },
                            { type: '長毛貓', sub: '2-6kg / >6kg', small: '1200 / 1400', full: '2400 / 2800', note: '*6kg以上 +$100/kg' },
                            { type: '升級項目', sub: '去油選項', small: '局部 200', full: '全身 800~1000', note: '*視毛量與狀況而定' }
                        ];
                        result.extras = [
                            { id: 'local', name: '局部修飾', desc: '貴賓臉/腳', price: '$150 / $300', forDog: true, forCat: false },
                            { id: 'style', name: '特殊造型', desc: '腳球 / 腳柱', price: '$400起 / $600起', forDog: true, forCat: false },
                            { id: 'scissor', name: '全身手剪', desc: '全身造型修剪', price: '$500起', forDog: true, forCat: false },
                            { id: 'other', name: '其他費用', desc: '拆結 / 除蚤 / 兇', price: '現場報價', forDog: true, forCat: true }
                        ];
                    }
                    setPriceData(result);
                } catch (err) {
                    showToast('讀取價目表失敗: ' + err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            // 實際執行儲存
            const executeSave = async () => {
                setSaving(true);
                try {
                    const categories = ['dogs', 'cats', 'extras'];
                    for (const cat of categories) {
                        // 1. 先刪除該分類的舊資料
                        const { error: deleteError } = await supabaseClient
                            .from('price_config')
                            .delete()
                            .eq('category', cat);
                        
                        if (deleteError) throw deleteError;
                        
                        // 2. 插入新資料
                        const { error: insertError } = await supabaseClient
                            .from('price_config')
                            .insert({
                                category: cat,
                                config_key: 'default',
                                config_value: priceData[cat],
                                updated_at: new Date().toISOString()
                            });
                        
                        if (insertError) throw insertError;
                    }
                    showToast('✅ 價目表已儲存！', 'success');
                } catch (err) {
                    showToast('❌ 儲存失敗: ' + err.message, 'error');
                } finally {
                    setSaving(false);
                    setPendingSave(false);
                }
            };

            // 點擊儲存按鈕 -> 顯示密碼 Modal
            const handleSaveClick = () => {
                setShowPwdModal(true);
            };

            // 密碼驗證通過後執行儲存
            const onPasswordVerified = async () => {
                setShowPwdModal(false);
                setPendingSave(true);
                await executeSave();
            };

            useEffect(() => {
                fetchPriceData();
            }, []);

            // 載入住宿圖片（用於預覽）
            const fetchBoardingImages = async () => {
                setBoardingImagesLoading(true);
                try {
                    const { data, error } = await supabaseClient
                        .from('boarding_price_images')
                        .select('*')
                        .order('display_order', { ascending: true });
                    
                    if (error) throw error;
                    setBoardingImages(data || []);
                } catch (error) {
                    console.error('載入住宿圖片失敗:', error);
                } finally {
                    setBoardingImagesLoading(false);
                }
            };

            // 當切換到 boarding_images Tab 時載入圖片
            useEffect(() => {
                if (activeCategory === 'boarding_images') {
                    fetchBoardingImages();
                }
            }, [activeCategory]);

            // 移除定時輪詢機制，改為手動重新整理按鈕，避免頁面不斷重新整理
            // 此 useEffect 僅在切換到 boarding_images 時載入一次圖片
            useEffect(() => {
                if (activeCategory === 'boarding_images') {
                    fetchBoardingImages();
                }
            }, [activeCategory]);

            // 狗狗編輯
            const updateDog = (index, field, value) => {
                setPriceData(prev => {
                    const newDogs = [...prev.dogs];
                    newDogs[index] = { ...newDogs[index], [field]: value };
                    return { ...prev, dogs: newDogs };
                });
            };

            const addDog = () => {
                setPriceData(prev => ({
                    ...prev,
                    dogs: [...prev.dogs, { weight: '', typeA: '', typeB: '', small: '', full: '' }]
                }));
            };

            const deleteDog = (index) => {
                if (!confirm('確定要刪除這項嗎？')) return;
                setPriceData(prev => ({
                    ...prev,
                    dogs: prev.dogs.filter((_, i) => i !== index)
                }));
            };

            // 貓咪編輯
            const updateCat = (index, field, value) => {
                setPriceData(prev => {
                    const newCats = [...prev.cats];
                    newCats[index] = { ...newCats[index], [field]: value };
                    return { ...prev, cats: newCats };
                });
            };

            const addCat = () => {
                setPriceData(prev => ({
                    ...prev,
                    cats: [...prev.cats, { type: '', sub: '', small: '', full: '', note: '' }]
                }));
            };

            const deleteCat = (index) => {
                if (!confirm('確定要刪除這項嗎？')) return;
                setPriceData(prev => ({
                    ...prev,
                    cats: prev.cats.filter((_, i) => i !== index)
                }));
            };

            // 額外項目編輯
            const updateExtra = (index, field, value) => {
                setPriceData(prev => {
                    const newExtras = [...prev.extras];
                    newExtras[index] = { ...newExtras[index], [field]: value };
                    return { ...prev, extras: newExtras };
                });
            };

            const addExtra = () => {
                setPriceData(prev => ({
                    ...prev,
                    extras: [...prev.extras, { id: Date.now().toString(), name: '', desc: '', price: '', forDog: false, forCat: false }]
                }));
            };

            const deleteExtra = (index) => {
                if (!confirm('確定要刪除這項嗎？')) return;
                setPriceData(prev => ({
                    ...prev,
                    extras: prev.extras.filter((_, i) => i !== index)
                }));
            };

            if (loading) {
                return <div className="py-20 text-center text-[#B5A89C] font-bold">載入價目表中...</div>;
            }

            // Toast 顯示
            const ToastDisplay = () => {
                if (!toast) return null;
                return (
                    <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-lg font-bold text-sm transition-all ${
                        toast.type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
                    }`}>
                        {toast.message}
                    </div>
                );
            };

                        // 密碼輸入元件 (內部使用)
            const PasswordInput = ({ onConfirm, onCancel }) => {
                const [pwd, setPwd] = useState("");
                const [verifying, setVerifying] = useState(false);

                const handleVerify = async () => {
                    setVerifying(true);
                    try {
                        const { error: loginError } = await supabaseClient.auth.signInWithPassword({
                            email: ADMIN_EMAIL,
                            password: pwd,
                        });

                        if (loginError) throw new Error("密碼錯誤，請重新輸入");
                        
                        onConfirm();
                        setPwd("");
                    } catch (err) {
                        alert(err.message);
                    } finally {
                        setVerifying(false);
                    }
                };

                return (
                    <>
                        <input 
                            type="password" 
                            autoFocus
                            value={pwd}
                            onChange={(e) => setPwd(e.target.value)}
                            placeholder="••••••••"
                            className="w-full cute-input px-4 py-3 text-center text-2xl tracking-[0.5em] mb-6 focus:ring-soosi-green/20"
                            onKeyDown={(e) => e.key === 'Enter' && handleVerify()}
                        />
                        <div className="flex gap-3 w-full">
                            <button onClick={onCancel} className="flex-1 py-3 text-gray-400 font-bold text-sm hover:bg-gray-50 rounded-xl transition-colors">取消</button>
                            <button 
                                onClick={handleVerify} 
                                disabled={verifying}
                                className="flex-1 py-3 bg-soosi-green text-white rounded-2xl font-bold shadow-lg shadow-soosi-green/20 active:scale-95 transition-all disabled:opacity-50"
                            >
                                {verifying ? '驗證中...' : '確認儲存'}
                            </button>
                        </div>
                    </>
                );
            };

            return (
                <div className="bg-white p-6 rounded-[2rem] shadow-sm space-y-6 border border-[#DDD6CE]">
                    <ToastDisplay />
                    
                    {/* 密碼驗證 Modal */}
                    {showPwdModal && (
                        <div className="fixed inset-0 z-[200] bg-soosi-dark/60 backdrop-blur-md flex items-center justify-center p-6 animate-in fade-in">
                            <div className="w-full max-w-xs bg-white rounded-[2.5rem] p-8 shadow-2xl animate-in zoom-in-95 flex flex-col items-center text-center">
                                <div className="w-16 h-16 bg-soosi-green/10 rounded-full flex items-center justify-center text-soosi-green mb-4">
                                    <Icon name="shield-check" size={32} />
                                </div>
                                <h3 className="font-black text-xl text-soosi-dark mb-2">權限驗證</h3>
                                <p className="text-xs text-gray-400 mb-6">請輸入管理員密碼以儲存價目表變更</p>
                                <PasswordInput 
                                    onConfirm={onPasswordVerified}
                                    onCancel={() => setShowPwdModal(false)}
                                />
                            </div>
                        </div>
                    )}
                    
                    {/* Header */}
                    <div className="flex justify-between items-center border-b border-[#DDD6CE] pb-4">
                        <div>
                            <h3 className="font-bold text-lg text-[#203B2A] flex items-center gap-2">
                                <Icon name="dollar-sign" size={20} className="text-[#B8A088]"/> 價目表管理
                            </h3>
                            <p className="text-[10px] text-gray-400 font-medium mt-0.5">編輯後點擊儲存，前台將即時更新</p>
                        </div>
                        <button 
                            onClick={handleSaveClick} 
                            disabled={saving}
                            className="px-6 py-2.5 bg-[#203B2A] text-white rounded-xl text-sm font-bold shadow-md hover:bg-[#162B1F] active:scale-95 transition-all disabled:opacity-50 flex items-center gap-2"
                        >
                            {saving ? <Icon name="loader-2" className="animate-spin" size={16}/> : <Icon name="save" size={16}/>}
                            {saving ? '儲存中...' : '儲存變更'}
                        </button>
                    </div>

                    {/* Tab 切換 - 更精緻的設計 */}
                    <div className="bg-gray-50/80 p-1.5 rounded-2xl border border-gray-100 shadow-sm">
                        <div className="flex gap-1">
